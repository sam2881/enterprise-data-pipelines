# AI Agent Platform - Prometheus Alert Rules
# Version: 5.0.0
#
# Alert Severity Levels:
#   - critical: Immediate action required (PagerDuty, Slack urgent)
#   - warning: Should be investigated soon
#   - info: For tracking, no immediate action
#
# Categories:
#   1. System Health
#   2. LLM/AI Performance
#   3. RAG System
#   4. Workflow/Incidents
#   5. Cost Management
#   6. Security/Compliance

groups:
  # ==========================================================================
  # 1. SYSTEM HEALTH ALERTS
  # ==========================================================================
  - name: system_health
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute"
          runbook_url: "https://docs.ai-agent/runbooks/service-down"

      - alert: HighErrorRate
        expr: |
          sum(rate(errors_total[5m])) by (component)
          / sum(rate(request_count[5m])) by (component) > 0.05
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "High error rate in {{ $labels.component }}"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.component }}"

      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.95, sum(rate(request_latency_seconds_bucket[5m])) by (le, endpoint))
          > 5
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "High latency on {{ $labels.endpoint }}"
          description: "P95 latency is {{ $value | humanizeDuration }} for {{ $labels.endpoint }}"

      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state == 2
        for: 1m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "Circuit breaker OPEN for {{ $labels.service }}"
          description: "{{ $labels.service }} circuit breaker has been open for 1+ minute. Service is unreachable."
          runbook_url: "https://docs.ai-agent/runbooks/circuit-breaker"

      - alert: CircuitBreakerHalfOpen
        expr: circuit_breaker_state == 1
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "Circuit breaker half-open for {{ $labels.service }}"
          description: "{{ $labels.service }} is recovering but unstable"

      - alert: RedisConnectionFailed
        expr: |
          sum(rate(errors_total{component="redis"}[5m])) > 0.1
        for: 2m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "Redis connection failures detected"
          description: "Redis is experiencing connection issues"

      - alert: HighMemoryUsage
        expr: |
          process_resident_memory_bytes / 1024 / 1024 > 2048
        for: 10m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "High memory usage on {{ $labels.job }}"
          description: "Memory usage is {{ $value | humanize1024 }}MB"

  # ==========================================================================
  # 2. LLM/AI PERFORMANCE ALERTS
  # ==========================================================================
  - name: llm_performance
    rules:
      - alert: LLMHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(llm_latency_seconds_bucket[5m])) by (le, model))
          > 10
        for: 5m
        labels:
          severity: warning
          category: llm
        annotations:
          summary: "High LLM latency for {{ $labels.model }}"
          description: "P95 LLM latency is {{ $value | humanizeDuration }}"

      - alert: LLMHighErrorRate
        expr: |
          sum(rate(llm_calls_total{status="error"}[5m])) by (model)
          / sum(rate(llm_calls_total[5m])) by (model) > 0.1
        for: 5m
        labels:
          severity: critical
          category: llm
        annotations:
          summary: "High LLM error rate for {{ $labels.model }}"
          description: "{{ $value | humanizePercentage }} of LLM calls failing"

      - alert: LLMTokenBudgetHigh
        expr: |
          sum(rate(llm_tokens_total[1h])) > 100000
        for: 30m
        labels:
          severity: warning
          category: llm
        annotations:
          summary: "High LLM token consumption"
          description: "Consuming {{ $value | humanize }} tokens per hour"

      - alert: LowConfidenceDecisions
        expr: |
          sum(rate(confidence_rejections_total[1h])) > 10
        for: 1h
        labels:
          severity: info
          category: llm
        annotations:
          summary: "Many low-confidence AI decisions"
          description: "{{ $value }} low-confidence decisions in the last hour requiring human review"

      - alert: LLMJudgeDisagreements
        expr: |
          sum(rate(llm_calls_total{purpose="judge",status="rejected"}[1h]))
          / sum(rate(llm_calls_total{purpose="judge"}[1h])) > 0.3
        for: 2h
        labels:
          severity: warning
          category: llm
        annotations:
          summary: "High LLM Judge rejection rate"
          description: "{{ $value | humanizePercentage }} of plans rejected by Judge"

  # ==========================================================================
  # 3. RAG SYSTEM ALERTS
  # ==========================================================================
  - name: rag_system
    rules:
      - alert: RAGHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(rag_latency_seconds_bucket[5m])) by (le))
          > 2
        for: 5m
        labels:
          severity: warning
          category: rag
        annotations:
          summary: "High RAG query latency"
          description: "P95 RAG latency is {{ $value | humanizeDuration }}"

      - alert: RAGLowResultCount
        expr: |
          avg(rag_results_count) < 1
        for: 30m
        labels:
          severity: warning
          category: rag
        annotations:
          summary: "RAG returning few results"
          description: "Average RAG results: {{ $value }}. Index may be empty or queries not matching."

      - alert: RAGCacheMissHigh
        expr: |
          sum(rate(cache_misses_total{cache_type="rag"}[5m]))
          / (sum(rate(cache_hits_total{cache_type="rag"}[5m])) + sum(rate(cache_misses_total{cache_type="rag"}[5m]))) > 0.8
        for: 30m
        labels:
          severity: info
          category: rag
        annotations:
          summary: "Low RAG cache hit rate"
          description: "Cache miss rate is {{ $value | humanizePercentage }}"

      - alert: WeaviateConnectionFailed
        expr: |
          sum(rate(rag_queries_total{status="error"}[5m])) > 0.1
        for: 2m
        labels:
          severity: critical
          category: rag
        annotations:
          summary: "Weaviate connection failures"
          description: "Vector database is experiencing connection issues"

      - alert: Neo4jConnectionFailed
        expr: |
          sum(rate(graph_queries_total{status="error"}[5m])) > 0.1
        for: 2m
        labels:
          severity: critical
          category: rag
        annotations:
          summary: "Neo4j connection failures"
          description: "Graph database is experiencing connection issues"

  # ==========================================================================
  # 4. WORKFLOW/INCIDENT ALERTS
  # ==========================================================================
  - name: workflow_incidents
    rules:
      - alert: HighPendingApprovals
        expr: approvals_pending > 10
        for: 30m
        labels:
          severity: warning
          category: workflow
        annotations:
          summary: "Many incidents pending approval"
          description: "{{ $value }} incidents waiting for human approval"

      - alert: LongApprovalWaitTime
        expr: |
          histogram_quantile(0.95, sum(rate(approval_wait_time_seconds_bucket[1h])) by (le))
          > 1800
        for: 1h
        labels:
          severity: warning
          category: workflow
        annotations:
          summary: "Long approval wait times"
          description: "P95 approval wait time is {{ $value | humanizeDuration }}"

      - alert: HighIncidentBacklog
        expr: incidents_active > 50
        for: 1h
        labels:
          severity: warning
          category: workflow
        annotations:
          summary: "High incident backlog"
          description: "{{ $value }} active incidents in the system"

      - alert: RemediationFailureRate
        expr: |
          sum(rate(remediation_executions_total{status="failed"}[1h]))
          / sum(rate(remediation_executions_total[1h])) > 0.2
        for: 1h
        labels:
          severity: critical
          category: workflow
        annotations:
          summary: "High remediation failure rate"
          description: "{{ $value | humanizePercentage }} of remediations failing"

      - alert: LongResolutionTime
        expr: |
          histogram_quantile(0.95, sum(rate(incident_resolution_time_seconds_bucket[6h])) by (le))
          > 7200
        for: 6h
        labels:
          severity: warning
          category: workflow
        annotations:
          summary: "Long incident resolution times"
          description: "P95 resolution time is {{ $value | humanizeDuration }}"

      - alert: WorkflowNodeStuck
        expr: |
          time() - workflow_node_start_timestamp > 300
        for: 5m
        labels:
          severity: warning
          category: workflow
        annotations:
          summary: "Workflow node stuck"
          description: "Node {{ $labels.node }} for incident {{ $labels.incident_id }} has been running for > 5 minutes"

  # ==========================================================================
  # 5. COST MANAGEMENT ALERTS
  # ==========================================================================
  - name: cost_management
    rules:
      - alert: DailyBudgetExceeded
        expr: llm_cost_daily > 100
        for: 1m
        labels:
          severity: warning
          category: cost
        annotations:
          summary: "Daily LLM budget exceeded"
          description: "Daily LLM cost is ${{ $value | printf \"%.2f\" }}"

      - alert: MonthlyBudgetWarning
        expr: |
          sum(llm_cost_total) > 2000
        for: 1m
        labels:
          severity: warning
          category: cost
        annotations:
          summary: "Approaching monthly budget limit"
          description: "Monthly LLM cost is ${{ $value | printf \"%.2f\" }}"

      - alert: BudgetDepleted
        expr: budget_remaining < 100
        for: 1m
        labels:
          severity: critical
          category: cost
        annotations:
          summary: "LLM budget nearly depleted"
          description: "Only ${{ $value | printf \"%.2f\" }} remaining"

      - alert: CostSpike
        expr: |
          rate(llm_cost_total[1h]) > 2 * avg_over_time(rate(llm_cost_total[24h])[7d:1h])
        for: 1h
        labels:
          severity: warning
          category: cost
        annotations:
          summary: "Unusual cost spike detected"
          description: "Current hourly rate is 2x the 7-day average"

  # ==========================================================================
  # 6. SECURITY/COMPLIANCE ALERTS
  # ==========================================================================
  - name: security_compliance
    rules:
      - alert: HighRiskActionWithoutApproval
        expr: |
          sum(rate(remediation_executions_total{risk_level="high",mode="auto"}[1h])) > 0
        for: 5m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "High-risk action executed without approval"
          description: "A high-risk remediation was auto-executed. Review immediately."
          runbook_url: "https://docs.ai-agent/runbooks/security-review"

      - alert: LowHumanOversightRate
        expr: |
          sum(rate(approvals_processed_total{action="approved"}[24h]))
          / sum(rate(remediation_executions_total[24h])) < 0.1
        for: 24h
        labels:
          severity: warning
          category: compliance
        annotations:
          summary: "Low human oversight rate"
          description: "Only {{ $value | humanizePercentage }} of actions had human oversight. EU AI Act requires meaningful human oversight."

      - alert: GuardrailTriggered
        expr: |
          sum(rate(errors_total{error_type="guardrail_blocked"}[1h])) > 5
        for: 1h
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Multiple guardrail blocks"
          description: "{{ $value }} requests blocked by LLM guardrails in the last hour"

      - alert: PIIDetected
        expr: |
          sum(rate(errors_total{error_type="pii_detected"}[1h])) > 0
        for: 5m
        labels:
          severity: warning
          category: compliance
        annotations:
          summary: "PII detected in LLM output"
          description: "LLM output contained potential PII. Review data handling."

      - alert: UnauthorizedAccessAttempt
        expr: |
          sum(rate(errors_total{error_type="unauthorized"}[15m])) > 5
        for: 5m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Multiple unauthorized access attempts"
          description: "{{ $value }} unauthorized access attempts in 15 minutes"

  # ==========================================================================
  # 7. MCP SERVER ALERTS
  # ==========================================================================
  - name: mcp_servers
    rules:
      - alert: MCPServerDown
        expr: mcp_server_up == 0
        for: 1m
        labels:
          severity: critical
          category: mcp
        annotations:
          summary: "MCP server {{ $labels.server }} is down"
          description: "MCP server has been unavailable for 1+ minute"

      - alert: MCPToolHighErrorRate
        expr: |
          sum(rate(mcp_tool_errors_total[5m])) by (server, tool)
          / sum(rate(mcp_tool_calls_total[5m])) by (server, tool) > 0.1
        for: 5m
        labels:
          severity: warning
          category: mcp
        annotations:
          summary: "High error rate for MCP tool {{ $labels.tool }}"
          description: "{{ $value | humanizePercentage }} error rate for {{ $labels.server }}/{{ $labels.tool }}"

      - alert: MCPToolHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(mcp_tool_latency_seconds_bucket[5m])) by (le, server, tool))
          > 5
        for: 5m
        labels:
          severity: warning
          category: mcp
        annotations:
          summary: "High latency for MCP tool {{ $labels.tool }}"
          description: "P95 latency is {{ $value | humanizeDuration }}"

  # ==========================================================================
  # 8. SERVICENOW/JIRA INTEGRATION ALERTS
  # ==========================================================================
  - name: integrations
    rules:
      - alert: ServiceNowHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(servicenow_latency_seconds_bucket[5m])) by (le))
          > 5
        for: 5m
        labels:
          severity: warning
          category: integration
        annotations:
          summary: "High ServiceNow API latency"
          description: "P95 latency is {{ $value | humanizeDuration }}"

      - alert: ServiceNowAuthFailure
        expr: |
          sum(rate(servicenow_requests_total{status="auth_error"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
          category: integration
        annotations:
          summary: "ServiceNow authentication failing"
          description: "Unable to authenticate with ServiceNow API"

      - alert: GitHubActionsHighFailureRate
        expr: |
          sum(rate(github_actions_runs_total{status="failure"}[1h]))
          / sum(rate(github_actions_runs_total[1h])) > 0.3
        for: 1h
        labels:
          severity: warning
          category: integration
        annotations:
          summary: "High GitHub Actions failure rate"
          description: "{{ $value | humanizePercentage }} of workflows failing"

      - alert: GitHubActionsLongDuration
        expr: |
          histogram_quantile(0.95, sum(rate(github_actions_duration_seconds_bucket[1h])) by (le, workflow))
          > 600
        for: 1h
        labels:
          severity: info
          category: integration
        annotations:
          summary: "Long GitHub Actions duration"
          description: "P95 duration for {{ $labels.workflow }} is {{ $value | humanizeDuration }}"
