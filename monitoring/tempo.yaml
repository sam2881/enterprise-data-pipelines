# Grafana Tempo Configuration
# WHY: Tempo is a distributed tracing backend that stores traces from OpenTelemetry
# HOW: Receives traces via OTLP (gRPC/HTTP), stores in local filesystem, queries via Grafana

server:
  http_listen_port: 3200

# Distributor receives traces from OpenTelemetry exporters
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Ingester batches and writes traces to storage
ingester:
  max_block_duration: 5m

# Compactor optimizes trace storage
compactor:
  compaction:
    block_retention: 48h    # Keep traces for 48 hours

# Metrics generator creates metrics from traces (optional)
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

# Storage configuration - local filesystem for development
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Query frontend configuration
querier:
  frontend_worker:
    frontend_address: ""

# Overrides for per-tenant settings
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
