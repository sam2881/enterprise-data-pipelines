# ==============================================================================
# METADATA
# ==============================================================================
# name: Scale Kubernetes Deployment
# description: Scale deployment replicas up or down based on load
# service: kubernetes
# component: deployment
# action: scale
# risk: low
# requires_approval: false
# estimated_time_minutes: 3
# tags: [kubernetes, k8s, deployment, scale, replicas, hpa]
# error_patterns:
#   - "high.*load"
#   - "response.*time.*slow"
#   - "queue.*backed.*up"
# keywords: [kubernetes, k8s, scale, replicas, deployment, load, capacity]
# pre_checks: [verify_deployment_exists, check_current_replicas]
# post_checks: [verify_replicas_running, check_pod_health]
# ==============================================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: scale-deployment-{{ deployment_name }}
  namespace: {{ namespace | default('default') }}
spec:
  template:
    spec:
      serviceAccountName: deployment-manager
      restartPolicy: Never
      containers:
        - name: kubectl
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e

              DEPLOYMENT="{{ deployment_name }}"
              NAMESPACE="{{ namespace | default('default') }}"
              REPLICAS="{{ replicas | default(3) }}"

              echo "=== Pre-Check: Current deployment state ==="
              kubectl get deployment $DEPLOYMENT -n $NAMESPACE

              CURRENT_REPLICAS=$(kubectl get deployment $DEPLOYMENT -n $NAMESPACE -o jsonpath='{.spec.replicas}')
              echo "Current replicas: $CURRENT_REPLICAS"
              echo "Target replicas: $REPLICAS"

              echo "=== Scaling deployment ==="
              kubectl scale deployment/$DEPLOYMENT -n $NAMESPACE --replicas=$REPLICAS

              echo "=== Waiting for scaling to complete ==="
              kubectl rollout status deployment/$DEPLOYMENT -n $NAMESPACE --timeout=180s

              echo "=== Post-Check: Verify new replica count ==="
              kubectl get pods -n $NAMESPACE -l app=$DEPLOYMENT

              NEW_READY=$(kubectl get deployment $DEPLOYMENT -n $NAMESPACE -o jsonpath='{.status.readyReplicas}')
              echo "Ready replicas: $NEW_READY"

              if [ "$NEW_READY" -eq "$REPLICAS" ]; then
                echo "=== Scaling completed successfully ==="
              else
                echo "WARNING: Not all replicas are ready"
                exit 1
              fi
