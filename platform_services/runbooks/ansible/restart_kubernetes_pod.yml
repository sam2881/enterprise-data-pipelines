---
# METADATA
# service: kubernetes
# action: restart
# component: pod
# keywords: [pod, restart, crashloop, oom, killed, kubernetes, k8s, deployment, container]
# risk: low
# requires_approval: false
# estimated_time: 3m
# rollback: scale_deployment.yml
# version: 1.0.0
# author: platform-team
# last_updated: 2024-03-01

- name: Restart Kubernetes Pod
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    namespace: "{{ target_namespace | default('default') }}"
    deployment_name: "{{ target_deployment }}"
    kubeconfig: "{{ kubeconfig_path | default('~/.kube/config') }}"

  pre_tasks:
    - name: "[PRE-CHECK] Verify kubectl is available"
      command: which kubectl
      register: kubectl_check
      changed_when: false

    - name: "[PRE-CHECK] Get current pod status"
      shell: |
        kubectl get pods -n {{ namespace }} -l app={{ deployment_name }} \
        -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.phase}{"\t"}{.status.containerStatuses[0].restartCount}{"\n"}{end}'
      register: pods_before
      changed_when: false

    - name: "[PRE-CHECK] Get deployment replicas"
      shell: kubectl get deployment {{ deployment_name }} -n {{ namespace }} -o jsonpath='{.spec.replicas}'
      register: replicas
      changed_when: false

    - name: "[PRE-CHECK] Log current state"
      debug:
        msg: |
          Namespace: {{ namespace }}
          Deployment: {{ deployment_name }}
          Replicas: {{ replicas.stdout }}
          Current Pods:
          {{ pods_before.stdout }}

  tasks:
    - name: "[ACTION] Rolling restart of deployment"
      shell: kubectl rollout restart deployment/{{ deployment_name }} -n {{ namespace }}
      register: restart_result

    - name: "[ACTION] Wait for rollout to complete"
      shell: kubectl rollout status deployment/{{ deployment_name }} -n {{ namespace }} --timeout=120s
      register: rollout_status
      retries: 3
      delay: 10
      until: rollout_status.rc == 0

  post_tasks:
    - name: "[POST-CHECK] Get new pod status"
      shell: |
        kubectl get pods -n {{ namespace }} -l app={{ deployment_name }} \
        -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.phase}{"\t"}{.status.containerStatuses[0].restartCount}{"\n"}{end}'
      register: pods_after
      changed_when: false

    - name: "[POST-CHECK] Verify all pods are running"
      shell: |
        kubectl get pods -n {{ namespace }} -l app={{ deployment_name }} \
        -o jsonpath='{.items[*].status.phase}' | tr ' ' '\n' | grep -v Running | wc -l
      register: non_running
      changed_when: false
      failed_when: non_running.stdout | int > 0

    - name: "[POST-CHECK] Check pod logs for errors"
      shell: |
        POD=$(kubectl get pods -n {{ namespace }} -l app={{ deployment_name }} -o jsonpath='{.items[0].metadata.name}')
        kubectl logs $POD -n {{ namespace }} --tail=20 2>&1 | grep -i "error\|exception\|fatal" || echo "No errors found"
      register: pod_logs
      changed_when: false

    - name: "[VALIDATION] Final status report"
      debug:
        msg: |
          ============================================
          KUBERNETES POD RESTART COMPLETED
          ============================================
          Namespace: {{ namespace }}
          Deployment: {{ deployment_name }}
          Rollout Status: {{ 'SUCCESS' if rollout_status.rc == 0 else 'FAILED' }}
          Non-Running Pods: {{ non_running.stdout }}
          New Pods:
          {{ pods_after.stdout }}
          ============================================
