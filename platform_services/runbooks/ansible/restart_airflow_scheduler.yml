---
# METADATA
# service: airflow
# action: restart
# component: scheduler
# keywords: [scheduler, heartbeat, down, missing, restart, airflow]
# risk: medium
# requires_approval: true
# estimated_time: 5m
# rollback: stop_airflow_scheduler.yml
# version: 1.2.0
# author: sre-team
# last_updated: 2024-01-15

- name: Restart Airflow Scheduler
  hosts: airflow_servers
  become: yes
  gather_facts: yes

  vars:
    airflow_home: /opt/airflow
    service_name: airflow-scheduler
    max_wait_seconds: 120
    health_check_url: "http://localhost:8080/health"

  pre_tasks:
    - name: "[PRE-CHECK] Verify Airflow installation exists"
      stat:
        path: "{{ airflow_home }}/airflow.cfg"
      register: airflow_config
      failed_when: not airflow_config.stat.exists

    - name: "[PRE-CHECK] Check current scheduler status"
      shell: systemctl status {{ service_name }} || true
      register: current_status
      changed_when: false

    - name: "[PRE-CHECK] Capture current PID"
      shell: pgrep -f "airflow scheduler" || echo "not_running"
      register: current_pid
      changed_when: false

    - name: "[PRE-CHECK] Log current state"
      debug:
        msg: "Current scheduler PID: {{ current_pid.stdout }}, Status: {{ current_status.rc }}"

  tasks:
    - name: "[ACTION] Stop Airflow Scheduler gracefully"
      systemd:
        name: "{{ service_name }}"
        state: stopped
      register: stop_result
      ignore_errors: yes

    - name: "[ACTION] Wait for scheduler to stop"
      wait_for:
        path: /var/run/airflow/scheduler.pid
        state: absent
        timeout: 30
      ignore_errors: yes

    - name: "[ACTION] Kill orphan processes if any"
      shell: pkill -9 -f "airflow scheduler" || true
      changed_when: false

    - name: "[ACTION] Clear scheduler state files"
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/run/airflow/scheduler.pid
        - /tmp/airflow_scheduler.err
      ignore_errors: yes

    - name: "[ACTION] Start Airflow Scheduler"
      systemd:
        name: "{{ service_name }}"
        state: started
        enabled: yes
      register: start_result

    - name: "[ACTION] Wait for scheduler to initialize"
      pause:
        seconds: 15

  post_tasks:
    - name: "[POST-CHECK] Verify scheduler process is running"
      shell: pgrep -f "airflow scheduler"
      register: new_pid
      retries: 5
      delay: 5
      until: new_pid.rc == 0

    - name: "[POST-CHECK] Verify scheduler heartbeat"
      uri:
        url: "{{ health_check_url }}"
        method: GET
        status_code: 200
        timeout: 10
      register: health_check
      retries: 3
      delay: 10
      until: health_check.status == 200
      ignore_errors: yes

    - name: "[POST-CHECK] Check scheduler logs for errors"
      shell: tail -50 {{ airflow_home }}/logs/scheduler/latest/*.log | grep -i "error\|exception" | head -5 || true
      register: log_errors
      changed_when: false

    - name: "[VALIDATION] Final status report"
      debug:
        msg: |
          ============================================
          SCHEDULER RESTART COMPLETED
          ============================================
          New PID: {{ new_pid.stdout }}
          Health Check: {{ health_check.status | default('N/A') }}
          Recent Errors: {{ log_errors.stdout_lines | length }}
          ============================================
