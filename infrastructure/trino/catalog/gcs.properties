# =============================================================================
# Trino Hive Catalog Configuration for GCS
# =============================================================================
# Query Parquet/CSV files directly from GCS buckets
# =============================================================================

connector.name=hive

# Metastore configuration (file-based for simplicity)
hive.metastore=file
hive.metastore.catalog.dir=gs://${ENV:GCS_BUCKET_GOLD}/hive-catalog

# GCS Configuration
hive.gcs.json-key-file-path=/etc/trino/gcp-key.json
hive.gcs.use-access-token=false

# Allow creating external tables pointing to GCS
hive.non-managed-table-writes-enabled=true
hive.non-managed-table-creates-enabled=true

# File format defaults
hive.storage-format=PARQUET
hive.compression-codec=SNAPPY
