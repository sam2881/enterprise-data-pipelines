# =============================================================================
# Trino BigQuery Catalog Configuration
# =============================================================================
# Query BigQuery tables directly from Trino
# =============================================================================

connector.name=bigquery

# GCP Project ID (set via environment variable or replace)
bigquery.project-id=${ENV:GCP_PROJECT_ID}

# Authentication via service account key
bigquery.credentials-file=/etc/trino/gcp-key.json

# Query settings
bigquery.views-enabled=true
bigquery.arrow-serialization.enabled=true

# Cost control
bigquery.query-results-cache.enabled=true
