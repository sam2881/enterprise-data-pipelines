# Production environment configuration
# DO NOT store secrets here - use Secret Manager

environment: prod
debug: false

gcp:
  project_id: ${GCP_PROJECT_ID}
  region: us-central1

database:
  host: ${DB_HOST}
  port: 5432
  database: data_agent_prod
  # Connection string built from Secret Manager values

composer:
  environment_name: data-agent-prod
  region: us-central1

git:
  repo_url: ${GIT_REPO_URL}
  branch_prefix: data-agent/prod/
  default_branch: main

jira:
  base_url: ${JIRA_BASE_URL}
  project_key: DATA

llm:
  provider: openai
  model: gpt-4
  temperature: 0.0
  max_tokens: 4096

logging:
  level: INFO
  format: json

timeouts:
  default_seconds: 3600
  approval_seconds: 86400  # 24 hours

feature_flags:
  require_approval_for_prod: true  # NEVER disable in prod
  enable_dry_run: false
  enable_audit_logging: true  # NEVER disable in prod
