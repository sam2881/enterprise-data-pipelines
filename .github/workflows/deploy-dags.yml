# =============================================================================
# Deploy DAGs to Cloud Composer
# =============================================================================
# WHY: Automatically sync generated DAGs and Spark jobs from enterprise-data-pipelines
#      repository to GCP Cloud Composer
# HOW: On PR merge to main in sam2881/enterprise-data-pipelines, validate and sync
#
# NOTE: This workflow should be configured in the TARGET repository:
#       https://github.com/sam2881/enterprise-data-pipelines
#
# ARCHITECTURE:
#   Data Agent (ai_agent_app) → GitHub PR → enterprise-data-pipelines → CI/CD → GCP Composer
#
# TRIGGER:
# - Push to main branch with changes in dags/ or spark/
# - Manual workflow dispatch
#
# FLOW:
# 1. Validate DAG syntax with Airflow
# 2. Run security checks
# 3. Get Composer DAGs bucket
# 4. Sync DAGs and Spark jobs
# 5. Notify on completion
# =============================================================================

name: Deploy DAGs to Cloud Composer

on:
  push:
    branches: [main]
    paths:
      - 'dags/**'
      - 'spark/**'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod
      dry_run:
        description: 'Dry run (validate only, no deploy)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  AIRFLOW_VERSION: '2.9.3'
  # Target repository: sam2881/enterprise-data-pipelines
  TARGET_REPO: 'sam2881/enterprise-data-pipelines'

jobs:
  # ===========================================================================
  # Validate DAGs
  # ===========================================================================
  validate:
    name: Validate DAG Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-airflow-${{ env.AIRFLOW_VERSION }}

      - name: Install Airflow
        run: |
          pip install --upgrade pip
          pip install apache-airflow==${{ env.AIRFLOW_VERSION }}
          pip install apache-airflow-providers-google
          pip install pyspark pandas structlog

      - name: Validate DAG syntax
        run: |
          echo "Validating DAGs..."

          # DAGs are in dags/ directory (enterprise-data-pipelines repo structure)
          if [ ! -d "dags" ]; then
            echo "No dags/ directory found, skipping validation"
            exit 0
          fi

          echo "Validating DAGs in dags/..."
          python -c "
          import sys
          import os
          os.environ['AIRFLOW_HOME'] = '/tmp/airflow'
          os.makedirs('/tmp/airflow', exist_ok=True)

          from airflow.models import DagBag

          dag_bag = DagBag(dag_folder='dags', include_examples=False)

          if dag_bag.import_errors:
              print('DAG Import Errors:')
              for dag_id, error in dag_bag.import_errors.items():
                  print(f'  {dag_id}: {error}')
              sys.exit(1)

          print(f'Successfully validated {len(dag_bag.dags)} DAGs')
          for dag_id in dag_bag.dags:
              print(f'  - {dag_id}')
          "

      - name: Security scan
        run: |
          echo "Running security checks..."

          # Check for hardcoded secrets in dags/
          if grep -r "password\s*=" dags/ 2>/dev/null | grep -v "Variable.get" | grep -v "Secret"; then
            echo "WARNING: Possible hardcoded password found"
          fi

          if grep -r "api_key\s*=" dags/ 2>/dev/null | grep -v "Variable.get" | grep -v "Secret"; then
            echo "WARNING: Possible hardcoded API key found"
          fi

          # Check spark/ directory too
          if [ -d "spark" ]; then
            if grep -r "password\s*=" spark/ 2>/dev/null | grep -v "getSecret"; then
              echo "WARNING: Possible hardcoded password found in spark/"
            fi
          fi

          echo "Security scan complete"

  # ===========================================================================
  # Deploy to Cloud Composer
  # ===========================================================================
  deploy:
    name: Deploy to Composer
    needs: validate
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')

    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          echo "DEPLOY_ENV=$ENV" >> $GITHUB_ENV

          # Set Composer environment name based on env
          case $ENV in
            dev)
              echo "COMPOSER_ENVIRONMENT=data-agent-dev-composer" >> $GITHUB_ENV
              ;;
            qa)
              echo "COMPOSER_ENVIRONMENT=data-agent-qa-composer" >> $GITHUB_ENV
              ;;
            prod)
              echo "COMPOSER_ENVIRONMENT=data-agent-prod-composer" >> $GITHUB_ENV
              ;;
          esac

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Get Composer DAGs bucket
        id: composer
        run: |
          echo "Getting Composer environment info..."

          DAGS_PREFIX=$(gcloud composer environments describe $COMPOSER_ENVIRONMENT \
            --location=${{ secrets.COMPOSER_LOCATION || 'us-central1' }} \
            --format="value(config.dagGcsPrefix)" 2>/dev/null || echo "")

          if [ -z "$DAGS_PREFIX" ]; then
            echo "ERROR: Could not get DAGs bucket for Composer environment $COMPOSER_ENVIRONMENT"
            echo "Make sure the Composer environment exists and you have access"
            exit 1
          fi

          # Extract bucket name
          DAGS_BUCKET=$(echo $DAGS_PREFIX | sed 's|gs://||' | cut -d'/' -f1)

          echo "dags_prefix=${DAGS_PREFIX}" >> $GITHUB_OUTPUT
          echo "dags_bucket=${DAGS_BUCKET}" >> $GITHUB_OUTPUT

          echo "Composer DAGs bucket: $DAGS_PREFIX"

      - name: Sync DAGs to Composer
        run: |
          echo "Syncing DAGs to Cloud Composer..."

          # Sync dags/ directory to Composer
          if [ -d "dags" ] && [ "$(ls -A dags 2>/dev/null)" ]; then
            echo "Syncing dags/ to ${{ steps.composer.outputs.dags_prefix }}/"
            gsutil -m rsync -r -d dags/ ${{ steps.composer.outputs.dags_prefix }}/
          else
            echo "No dags/ directory found, skipping DAG sync"
          fi

          echo "DAGs synced successfully"

      - name: Sync Spark jobs to GCS
        run: |
          echo "Syncing Spark jobs to GCS..."

          SPARK_BUCKET="gs://${{ secrets.GCP_PROJECT_ID }}-gold/spark"

          if [ -d "spark" ] && [ "$(ls -A spark 2>/dev/null)" ]; then
            echo "Syncing spark/ to $SPARK_BUCKET/"
            gsutil -m rsync -r -d spark/ $SPARK_BUCKET/
          else
            echo "No spark/ directory found, skipping Spark sync"
          fi

          echo "Spark jobs synced successfully"

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."

          # List deployed DAGs
          echo "Deployed DAGs:"
          gsutil ls ${{ steps.composer.outputs.dags_prefix }}/*.py 2>/dev/null || echo "  No DAGs found"

          # Check Airflow web UI (if accessible)
          AIRFLOW_URI=$(gcloud composer environments describe $COMPOSER_ENVIRONMENT \
            --location=${{ secrets.COMPOSER_LOCATION || 'us-central1' }} \
            --format="value(config.airflowUri)" 2>/dev/null || echo "")

          if [ -n "$AIRFLOW_URI" ]; then
            echo "Airflow Web UI: $AIRFLOW_URI"
          fi

      - name: Post deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Repository**: ${{ env.TARGET_REPO }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ env.DEPLOY_ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Composer**: ${{ env.COMPOSER_ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **DAGs Bucket**: ${{ steps.composer.outputs.dags_prefix }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed DAGs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          gsutil ls ${{ steps.composer.outputs.dags_prefix }}/*.py 2>/dev/null || echo "No DAGs"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Spark Jobs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          gsutil ls gs://${{ secrets.GCP_PROJECT_ID }}-gold/spark/*.py 2>/dev/null || echo "No Spark jobs"
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Notify on completion
  # ===========================================================================
  notify:
    name: Notify
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="${{ needs.deploy.result }}"
          if [ "$STATUS" == "success" ]; then
            COLOR="good"
            TEXT="DAGs deployed successfully to ${{ github.event.inputs.environment || 'dev' }}"
          else
            COLOR="danger"
            TEXT="DAG deployment failed"
          fi

          curl -X POST $SLACK_WEBHOOK_URL \
            -H 'Content-type: application/json' \
            -d "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"title\": \"DAG Deployment\",
                \"text\": \"$TEXT\",
                \"fields\": [
                  {\"title\": \"Repository\", \"value\": \"${{ github.repository }}\", \"short\": true},
                  {\"title\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"short\": true}
                ]
              }]
            }"
