# =============================================================================
# Validate & Deploy DAGs
# =============================================================================
# WHY: Validate generated DAGs on push/PR to enterprise-data-pipelines.
#      Actual deployment happens via dag-sync container polling this repo.
#
# NOTE: This workflow should be in the TARGET repository:
#       https://github.com/sam2881/enterprise-data-pipelines
#
# FLOW:
# 1. Validate DAG syntax with Airflow DagBag
# 2. Run security checks (no hardcoded secrets)
# 3. Merge to main → dag-sync container picks up changes within 60s
# =============================================================================

name: Validate DAGs

on:
  push:
    branches: [main]
    paths:
      - 'dags/**'
      - 'spark_jobs/**'
      - 'sql/**'

  pull_request:
    branches: [main]
    paths:
      - 'dags/**'
      - 'spark_jobs/**'
      - 'sql/**'

  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  AIRFLOW_VERSION: '2.9.3'
  GCP_PROJECT_ID: 'agent-ai-test-461120'
  GCP_REGION: 'us-central1'

jobs:
  validate:
    name: Validate DAG Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-airflow-${{ env.AIRFLOW_VERSION }}

      - name: Install Airflow
        run: |
          python -m pip install --upgrade pip
          AIRFLOW_VERSION=${{ env.AIRFLOW_VERSION }}
          PYTHON_VERSION="$(python --version | cut -d " " -f 2 | cut -d "." -f 1-2)"
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"
          pip install apache-airflow-providers-google pyspark pandas structlog great_expectations psycopg2-binary

      - name: Validate DAG syntax
        run: |
          if [ ! -d "dags" ]; then
            echo "No dags/ directory found, skipping"
            exit 0
          fi

          echo "Validating Python syntax for all DAG files..."

          # Simple Python syntax check for all Python files
          find dags/ -name "*.py" | while read dag_file; do
            echo "Checking $dag_file..."
            python -m py_compile "$dag_file" || exit 1
          done

          echo "✅ All Python files have valid syntax"

          # DagBag validation with dag_utilities on path
          echo ""
          echo "Running Airflow DagBag validation..."
          export AIRFLOW_HOME=$(mktemp -d)
          airflow db init 2>/dev/null || airflow db migrate 2>/dev/null
          python -c "
          import sys
          sys.path.insert(0, 'dags')
          from airflow.models import DagBag
          bag = DagBag(dag_folder='dags', include_examples=False)
          if bag.import_errors:
              for path, err in bag.import_errors.items():
                  print(f'ERROR: {path}: {err}')
              sys.exit(1)
          print(f'DagBag: {len(bag.dags)} DAGs loaded, 0 errors')
          for dag_id in bag.dags:
              print(f'  - {dag_id}')
          " || exit 1

          echo "✅ DagBag validation passed"

          # List the DAGs found
          echo ""
          echo "DAG files found:"
          ls -1 dags/*.py 2>/dev/null || echo "No Python files in dags/"

      - name: Security scan
        run: |
          echo "Running security checks..."
          ISSUES=0

          for dir in dags spark_jobs sql; do
            if [ -d "$dir" ]; then
              if grep -rn "password\s*=" "$dir/" 2>/dev/null | grep -v "Variable.get" | grep -v "Secret" | grep -v "#"; then
                echo "WARNING: Possible hardcoded password in $dir/"
                ISSUES=$((ISSUES + 1))
              fi
              if grep -rn "api_key\s*=" "$dir/" 2>/dev/null | grep -v "Variable.get" | grep -v "Secret" | grep -v "#"; then
                echo "WARNING: Possible hardcoded API key in $dir/"
                ISSUES=$((ISSUES + 1))
              fi
            fi
          done

          if [ $ISSUES -gt 0 ]; then
            echo "Found $ISSUES potential security issues"
          else
            echo "Security scan passed"
          fi

      - name: Summary
        run: |
          echo "## DAG Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "DAGs validated successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment**: Merged DAGs are auto-synced to Docker Airflow via \`dag-sync\` container (polls every 60s)." >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to GCP
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy DAGs to GCS
        run: |
          echo "📦 Deploying artifacts to GCS..."

          # Deploy DAGs
          if [ -d "dags" ]; then
            gsutil -m rsync -r -d dags/ gs://${{ env.GCP_PROJECT_ID }}-airflow-dags/dags/
            echo "✅ DAGs synced to gs://${{ env.GCP_PROJECT_ID }}-airflow-dags/dags/"
          fi

          # Deploy Spark jobs
          if [ -d "spark_jobs" ]; then
            gsutil -m rsync -r -d spark_jobs/ gs://${{ env.GCP_PROJECT_ID }}-temp/spark_jobs/
            echo "✅ Spark jobs synced to gs://${{ env.GCP_PROJECT_ID }}-temp/spark_jobs/"
          fi

          # Deploy SQL scripts
          if [ -d "sql" ]; then
            gsutil -m rsync -r -d sql/ gs://${{ env.GCP_PROJECT_ID }}-temp/sql/
            echo "✅ SQL synced to gs://${{ env.GCP_PROJECT_ID }}-temp/sql/"
          fi

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GCS Buckets Synced:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **DAGs:** \`gs://${{ env.GCP_PROJECT_ID }}-airflow-dags/dags/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Spark Jobs:** \`gs://${{ env.GCP_PROJECT_ID }}-temp/spark_jobs/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SQL Scripts:** \`gs://${{ env.GCP_PROJECT_ID }}-temp/sql/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The \`dag-sync\` container will pick up changes within 60 seconds." >> $GITHUB_STEP_SUMMARY
