# GitHub Actions CI/CD Pipeline
# Deploys to GCP: Airflow DAGs + Spark Jobs + Metadata
#
# Triggers on push to main branch
# Deploys automatically without manual intervention

name: Deploy Data Pipelines to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
  GCP_REGION: us-central1
  AIRFLOW_BUCKET: ${{ secrets.AIRFLOW_BUCKET }}
  SPARK_BUCKET: ${{ secrets.SPARK_BUCKET }}
  POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

jobs:
  # ==========================================================================
  # VALIDATE
  # ==========================================================================
  validate:
    name: Validate Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate DAG syntax
        run: |
          pip install apache-airflow
          for dag in dags/*.py; do
            python -c "import ast; ast.parse(open('$dag').read())"
            echo "✅ Valid: $dag"
          done

      - name: Validate SQL syntax
        run: |
          for sql in metadata/*.sql; do
            if head -1 "$sql" | grep -q "INSERT\|UPDATE\|CREATE"; then
              echo "✅ Valid SQL: $sql"
            fi
          done

  # ==========================================================================
  # DEPLOY METADATA
  # ==========================================================================
  deploy-metadata:
    name: Deploy Metadata to PostgreSQL
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Execute metadata SQL
        run: |
          for sql in metadata/insert_metadata_*.sql; do
            echo "Executing: $sql"
            PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql \
              -h ${{ env.POSTGRES_HOST }} \
              -U ${{ env.POSTGRES_USER }} \
              -d ${{ env.POSTGRES_DB }} \
              -f "$sql"
            echo "✅ Executed: $sql"
          done

  # ==========================================================================
  # DEPLOY SPARK JOBS
  # ==========================================================================
  deploy-spark-jobs:
    name: Deploy Spark Jobs to GCS
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload Spark jobs
        run: |
          # Upload common processors
          gsutil -m cp -r spark_jobs/common/*.py \
            gs://${{ env.SPARK_BUCKET }}/common/

          echo "✅ Spark jobs deployed to gs://${{ env.SPARK_BUCKET }}/common/"

  # ==========================================================================
  # DEPLOY DAGS
  # ==========================================================================
  deploy-dags:
    name: Deploy DAGs to Airflow
    runs-on: ubuntu-latest
    needs: [deploy-metadata, deploy-spark-jobs]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload DAGs to Airflow bucket
        run: |
          gsutil -m cp dags/*.py gs://${{ env.AIRFLOW_BUCKET }}/dags/
          echo "✅ DAGs deployed to gs://${{ env.AIRFLOW_BUCKET }}/dags/"

      - name: Trigger Airflow DAG sync
        run: |
          echo "DAGs will be automatically picked up by Airflow"
          echo "Airflow scans the DAGs bucket every 30 seconds"

  # ==========================================================================
  # VERIFY DEPLOYMENT
  # ==========================================================================
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy-dags
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify files in GCS
        run: |
          echo "=== Spark Jobs ==="
          gsutil ls gs://${{ env.SPARK_BUCKET }}/common/

          echo "=== DAGs ==="
          gsutil ls gs://${{ env.AIRFLOW_BUCKET }}/dags/

      - name: Deployment Summary
        run: |
          echo "=============================================="
          echo "DEPLOYMENT COMPLETE"
          echo "=============================================="
          echo ""
          echo "Spark Jobs: gs://${{ env.SPARK_BUCKET }}/common/"
          echo "DAGs: gs://${{ env.AIRFLOW_BUCKET }}/dags/"
          echo ""
          echo "DAGs will be available in Airflow within 60 seconds"
          echo "=============================================="
