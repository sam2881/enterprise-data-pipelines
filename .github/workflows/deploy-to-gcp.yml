name: Validate and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate DAGs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate DAG Syntax
        run: |
          echo "Validating DAG syntax..."
          
          if [ ! -d "dags" ]; then
            echo "No dags/ directory found - skipping"
            exit 0
          fi
          
          # Use Python AST to validate syntax
          python3 << 'PYEOF'
          import ast
          import os
          import sys
          
          dags_dir = 'dags'
          errors = []
          validated = []
          
          for filename in os.listdir(dags_dir):
              if filename.endswith('.py'):
                  filepath = os.path.join(dags_dir, filename)
                  try:
                      with open(filepath, 'r') as f:
                          code = f.read()
                      ast.parse(code)
                      validated.append(filename)
                      print(f'✅ {filename}')
                  except SyntaxError as e:
                      errors.append((filename, str(e)))
                      print(f'❌ {filename}: {e}')
          
          if errors:
              print(f'\n{len(errors)} file(s) failed validation')
              sys.exit(1)
          
          print(f'\n✅ All {len(validated)} DAG(s) validated successfully')
          PYEOF

  deploy:
    name: Deploy to GCP
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy placeholder
        run: echo "Deployment would run with GCP credentials configured"
