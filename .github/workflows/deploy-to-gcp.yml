# =============================================================================
# Deploy DAGs and Spark Jobs to GCP Cloud Composer
# =============================================================================
# WHY: Automatically deploy generated pipeline artifacts to GCP Composer
# HOW: On merge to main, validate DAGs and sync to Composer's GCS bucket
#
# ARCHITECTURE:
#   Data Agent (ai_agent_app) → Creates PR → This Repo → CI/CD → GCP Composer
#
# REQUIRED SECRETS:
#   - GCP_SA_KEY: Service account JSON key with Composer Admin permissions
#   - GCP_PROJECT_ID: GCP project ID
#   - COMPOSER_LOCATION: Composer region (e.g., us-central1)
#   - SLACK_WEBHOOK_URL: (Optional) For notifications
# =============================================================================

name: Deploy to GCP Cloud Composer

on:
  push:
    branches: [main]
    paths:
      - 'dags/**'
      - 'spark/**'
      - 'sql/**'

  pull_request:
    branches: [main]
    paths:
      - 'dags/**'
      - 'spark/**'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      dry_run:
        description: 'Dry run (validate only)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  AIRFLOW_VERSION: '2.9.3'

jobs:
  # ===========================================================================
  # Validate DAGs
  # ===========================================================================
  validate:
    name: Validate DAGs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-airflow-${{ env.AIRFLOW_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install apache-airflow==${{ env.AIRFLOW_VERSION }} --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${{ env.AIRFLOW_VERSION }}/constraints-3.11.txt"
          pip install apache-airflow-providers-google

      - name: Validate DAGs
        run: |
          echo "Validating DAGs..."

          if [ ! -d "dags" ]; then
            echo "No dags/ directory found"
            exit 0
          fi

          # Initialize Airflow DB (required for DagBag)
          export AIRFLOW_HOME=/tmp/airflow
          mkdir -p $AIRFLOW_HOME
          
          # Use SQLite for validation (lightweight)
          export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:///$AIRFLOW_HOME/airflow.db
          export AIRFLOW__CORE__LOAD_EXAMPLES=False
          export AIRFLOW__CORE__DAGS_FOLDER=$(pwd)/dags
          
          # Initialize the database
          airflow db init
          
          # Validate DAGs using Python AST first (syntax check)
          echo "=== Syntax Check ==="
          for dag in dags/*.py; do
            python -c "import ast; ast.parse(open('$dag').read())" && echo "✅ Syntax OK: $dag"
          done

          # Now use DagBag for import validation
          echo ""
          echo "=== Import Validation ==="
          python << 'PYEOF'
import sys
import os
os.environ['AIRFLOW_HOME'] = '/tmp/airflow'

from airflow.models import DagBag

dag_bag = DagBag(dag_folder='dags', include_examples=False)

if dag_bag.import_errors:
    print('❌ DAG Import Errors:')
    for dag_id, error in dag_bag.import_errors.items():
        print(f'  {dag_id}: {error}')
    sys.exit(1)

print(f'✅ Successfully validated {len(dag_bag.dags)} DAGs:')
for dag_id in dag_bag.dags:
    print(f'  - {dag_id}')
PYEOF

      - name: Lint Python files
        run: |
          pip install flake8
          flake8 dags/ --max-line-length=120 --ignore=E501,W503,E402 || true

  # ===========================================================================
  # Deploy to GCP Composer
  # ===========================================================================
  deploy:
    name: Deploy to Composer
    needs: validate
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')

    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get Composer bucket
        id: composer
        run: |
          BUCKET=$(gcloud composer environments describe ${{ secrets.COMPOSER_ENV_NAME }}             --location ${{ secrets.COMPOSER_LOCATION }}             --format="value(config.dagGcsPrefix)" | sed 's|gs://||' | cut -d'/' -f1)
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT

      - name: Deploy DAGs
        run: |
          echo "Deploying DAGs to gs://${{ steps.composer.outputs.bucket }}/dags/"
          
          if [ -d "dags" ]; then
            gsutil -m cp -r dags/*.py gs://${{ steps.composer.outputs.bucket }}/dags/
            echo "✅ DAGs deployed successfully"
          fi

      - name: Deploy Spark jobs
        run: |
          if [ -d "spark" ]; then
            gsutil -m cp -r spark/*.py gs://${{ secrets.SPARK_BUCKET }}/jobs/
            echo "✅ Spark jobs deployed"
          fi

      - name: Deployment Summary
        run: |
          echo "=============================================="
          echo "DEPLOYMENT COMPLETE"
          echo "=============================================="
          echo "DAGs: gs://${{ steps.composer.outputs.bucket }}/dags/"
          echo "Environment: ${{ github.event.inputs.environment || 'dev' }}"
          echo "=============================================="
